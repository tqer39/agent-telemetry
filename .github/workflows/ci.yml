name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
      - name: session-indexer tests and lint
        run: mise run test
      - name: Built wheel provides both CLIs
        run: |
          uv build --project session-indexer --out-dir "$RUNNER_TEMP/usage-wheel"
          uv run --isolated --no-project --with "$RUNNER_TEMP/usage-wheel/"*.whl agent-telemetry --help
          uv run --isolated --no-project --with "$RUNNER_TEMP/usage-wheel/"*.whl session-indexer --help
      - name: compose file is valid
        run: GF_SECURITY_ADMIN_PASSWORD=ci docker compose config -q
      - name: collector config is valid
        run: >-
          docker run --rm -e DEBUG_VERBOSITY=basic
          -v "$PWD/otel-collector/config.yaml:/cfg.yaml:ro"
          otel/opentelemetry-collector-contrib:0.120.0 validate --config=/cfg.yaml
      - name: collector redacts sensitive data
        run: python3 scripts/test-collector-redaction.py
      - name: prometheus config and rules are valid
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
      - name: dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: yamllint / actionlint
        run: yamllint --no-warnings . && actionlint

  usage-zstd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          version: 2026.10.20
      - name: Validate optional Zstandard support with Python 3.14
        run: |
          mise exec python@3.14.8 -- uv run --isolated --python 3.14.8 --locked --project session-indexer \
            python -m unittest discover -s session-indexer/tests -p 'test_usage_*.py' -v

  # main の ruleset は `workflow-result` を必須チェックにしている（terraform-github の標準保護）
  workflow-result:
    needs: [test, usage-zstd]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check workflow result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ZSTD_RESULT: ${{ needs.usage-zstd.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$ZSTD_RESULT" != "success" ]; then
            echo "test=$TEST_RESULT usage-zstd=$ZSTD_RESULT"
            exit 1
          fi
