[project]
name = "session-indexer"
version = "0.1.0"
description = "Summarize Claude Code and Codex session transcripts into per-session Prometheus metrics"
requires-python = ">=3.12"
dependencies = ["prometheus-client>=0.21"]

[project.scripts]
session-indexer = "session_indexer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"] # binding 0.0.0.0 inside the container is intentional; compose publishes nothing for this service

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
