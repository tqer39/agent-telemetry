global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Per-session summaries parsed from ~/.claude/projects and ~/.codex/sessions.
  - job_name: session-indexer
    scrape_interval: 60s
    static_configs:
      - targets: ["session-indexer:9464"]
