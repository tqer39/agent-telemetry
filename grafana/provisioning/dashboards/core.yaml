# Core dashboards. Keep the provider name "default": renaming it makes Grafana
# delete and re-create these dashboards, which drops users' stars.
apiVersion: 1
providers:
  - name: default
    orgId: 1
    folder: Agent Telemetry
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
